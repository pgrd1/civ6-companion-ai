name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  test:
    name: Release x64 tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Civ6CodexCompanion.sln -p:Platform=x64 -p:NuGetAuditMode=all -p:NuGetAuditLevel=low

      - name: Test
        run: dotnet test Civ6CodexCompanion.sln -c Release -p:Platform=x64 --no-restore --logger trx --results-directory TestResults

      - name: Vulnerable package scan
        run: dotnet list Civ6CodexCompanion.sln package --vulnerable --include-transitive
